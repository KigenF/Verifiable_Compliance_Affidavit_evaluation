[package]
name = "vca-eval"
version = "1.0.0"
edition = "2021"

[dependencies]
# Cryptography
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa", "serde"] }

# Ethereum primitives
alloy-primitives = { version = "0.8", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
thiserror = "2.0"
rand = "0.8"
hex = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
csv = "1.3"
chrono = "0.4"

[[bench]]
name = "benchmark"
harness = false
